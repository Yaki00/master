# Master Panel — master.pixelbrain.fr
# Rate limits : login strict, API modéré (complète la protection app)

limit_req_zone $binary_remote_addr zone=master_login:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=master_api:10m rate=30r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name master.pixelbrain.fr;

    ssl_certificate     /etc/letsencrypt/live/master.pixelbrain.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/master.pixelbrain.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # NextAuth : session/csrf/providers en GET — pas de rate limit nginx (sinon 503 + login cassé).
    # Le brute-force login est géré par l'app (lib/rate-limit.ts).
    location /api/auth/ {
        set $backend http://master-web:3040;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit nginx uniquement sur la soumission du mot de passe
    location = /api/auth/callback/credentials {
        limit_req zone=master_login burst=3 nodelay;
        limit_req_status 429;
        set $backend http://master-web:3040;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/signin/credentials {
        limit_req zone=master_login burst=3 nodelay;
        limit_req_status 429;
        set $backend http://master-web:3040;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/metrics {
        limit_req zone=master_api burst=10 nodelay;
        set $backend http://master-web:3040;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $backend http://master-web:3040;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
